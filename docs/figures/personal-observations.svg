<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="626" viewBox="0 0 1200 626" role="img" aria-labelledby="title desc"><title id="title">Perceived responsiveness with reactive2</title><desc id="desc">Anecdotal experience on one laptop: less stuttering and more responsiveness while using and opening multiple programs compared with Mint 7.0. No numerical speedup, patch attribution or battery-life claim.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1200" height="626" rx="0" fill="#f4f7fb" stroke="none"/><text x="48" y="52" font-size="16" fill="#087f75" font-weight="700">PERSONAL OBSERVATIONS</text><text x="48" y="103" font-size="38" fill="#172b4d" font-weight="700">Less stuttering. More responsiveness.</text><text x="48" y="145" font-size="21" fill="#53647d" font-weight="400">Reported experience with reactive2 compared with the original Mint 7.0 kernel.</text><rect x="48" y="183" width="1104" height="68" rx="18" fill="#e3f3ee" stroke="none"/><text x="72" y="226" font-size="20" fill="#08685e" font-weight="700">ANECDOTAL  /  One laptop  /  Everyday use  /  No measured speedup</text><rect x="48" y="279" width="540" height="190" rx="18" fill="#ffffff" stroke="#d8e2ef"/><text x="74" y="326" font-size="25" fill="#172b4d" font-weight="700">During application use</text><text x="74" y="371" font-size="21" fill="#344763" font-weight="400">The device feels more immediate.</text><text x="74" y="405" font-size="21" fill="#344763" font-weight="400">Less stuttering is noticeable.</text><rect x="612" y="279" width="540" height="190" rx="18" fill="#ffffff" stroke="#d8e2ef"/><text x="638" y="326" font-size="25" fill="#172b4d" font-weight="700">With several programs open</text><text x="638" y="371" font-size="21" fill="#344763" font-weight="400">Opening and using multiple applications</text><text x="638" y="405" font-size="21" fill="#344763" font-weight="400">feels more responsive.</text><text x="48" y="514" font-size="23" fill="#172b4d" font-weight="700">What this observation does not establish</text><text x="48" y="552" font-size="21" fill="#53647d" font-weight="400">A numerical speedup, the effect of a specific patch, or longer battery life.</text><text x="48" y="590" font-size="18" fill="#53647d" font-weight="400">Mint used the distribution kernel with the local settings documented in this repository.</text></g></svg>
