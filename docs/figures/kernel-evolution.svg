<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="668" viewBox="0 0 1200 668" role="img" aria-labelledby="title desc"><title id="title">Evolution of the custom kernel configurations</title><desc id="desc">Four Linux 7.2.9 builds: efficiency, thinlto, reactive and reactive2. Arrows show build lineage, not measured gains. Mint 7.0.0-38-generic is the configuration reference.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1200" height="668" rx="0" fill="#f4f7fb" stroke="none"/><text x="48" y="52" font-size="16" fill="#2563eb" font-weight="700">THE KERNEL CONFIGURATIONS</text><text x="48" y="103" font-size="40" fill="#172b4d" font-weight="700">Four builds, one laptop</text><text x="48" y="143" font-size="21" fill="#53647d" font-weight="400">Huawei MateBook 14  /  Ryzen 5 2500U  /  8 GB RAM</text><rect x="48" y="178" width="1104" height="88" rx="18" fill="#e6edf8" stroke="none"/><text x="72" y="212" font-size="23" fill="#172b4d" font-weight="700">Mint 7.0.0-38-generic</text><text x="72" y="244" font-size="19" fill="#53647d" font-weight="400">Reference for the configuration diffs. Local boot and sysctl settings also apply.</text><rect x="48" y="314" width="264" height="244" rx="18" fill="#ffffff" stroke="#d8e2ef"/><rect x="48" y="314" width="264" height="7" rx="0" fill="#2563eb" stroke="none"/><text x="68" y="359" font-size="19" fill="#2563eb" font-weight="700">01</text><text x="68" y="402" font-size="27" fill="#172b4d" font-weight="700">efficiency</text><text x="68" y="433" font-size="17" fill="#53647d" font-weight="400">Linux 7.2.9</text><text x="68" y="469" font-size="17" fill="#344763" font-weight="400">Lazy preemption</text><text x="68" y="498" font-size="17" fill="#344763" font-weight="400">Native CPU targeting</text><path d="M 312 293 H 328 m -6 -5 l 6 5 -6 5" fill="none" stroke="#64748b" stroke-width="2"/><rect x="328" y="314" width="264" height="244" rx="18" fill="#ffffff" stroke="#d8e2ef"/><rect x="328" y="314" width="264" height="7" rx="0" fill="#2563eb" stroke="none"/><text x="348" y="359" font-size="19" fill="#2563eb" font-weight="700">02</text><text x="348" y="402" font-size="27" fill="#172b4d" font-weight="700">thinlto</text><text x="348" y="433" font-size="17" fill="#53647d" font-weight="400">Linux 7.2.9</text><text x="348" y="469" font-size="17" fill="#344763" font-weight="400">BORE 6.8.0 + ThinLTO</text><text x="348" y="498" font-size="17" fill="#344763" font-weight="400">Full preemption at boot</text><path d="M 592 293 H 608 m -6 -5 l 6 5 -6 5" fill="none" stroke="#64748b" stroke-width="2"/><rect x="608" y="314" width="264" height="244" rx="18" fill="#ffffff" stroke="#d8e2ef"/><rect x="608" y="314" width="264" height="7" rx="0" fill="#2563eb" stroke="none"/><text x="628" y="359" font-size="19" fill="#2563eb" font-weight="700">03</text><text x="628" y="402" font-size="27" fill="#172b4d" font-weight="700">reactive</text><text x="628" y="433" font-size="17" fill="#53647d" font-weight="400">Linux 7.2.9</text><text x="628" y="469" font-size="17" fill="#344763" font-weight="400">HZ1000 + ORC</text><text x="628" y="498" font-size="17" fill="#344763" font-weight="400">RCU boot settings</text><path d="M 872 293 H 888 m -6 -5 l 6 5 -6 5" fill="none" stroke="#64748b" stroke-width="2"/><rect x="888" y="314" width="264" height="244" rx="18" fill="#ffffff" stroke="#d8e2ef"/><rect x="888" y="314" width="264" height="7" rx="0" fill="#087f75" stroke="none"/><text x="908" y="359" font-size="19" fill="#087f75" font-weight="700">04</text><text x="908" y="402" font-size="27" fill="#172b4d" font-weight="700">reactive2</text><text x="908" y="433" font-size="17" fill="#53647d" font-weight="400">Linux 7.2.9</text><text x="908" y="469" font-size="17" fill="#344763" font-weight="400">ACPI debugging disabled</text><text x="908" y="498" font-size="17" fill="#344763" font-weight="400">ZRAM_MULTI_COMP</text><text x="908" y="527" font-size="17" fill="#344763" font-weight="400">TTM patch</text><text x="48" y="600" font-size="19" fill="#53647d" font-weight="400">Each custom build develops the previous one; the cards show selected changes.</text><text x="48" y="633" font-size="18" fill="#53647d" font-weight="400">Build history, not a performance ranking. Details: configs/ and docs/build-inventory.md.</text></g></svg>
